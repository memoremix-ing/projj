[package]
name = "projj-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# Hutch builds this binary and runs it inside the app bundle.
[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
# Put in place by `hutch electrobun sync`, matching hutch.config.ts.
electrobun = { path = ".hutch/devkit/rust-sdk" }
getrandom = "0.3"
projj = { path = ".." }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

# As in ../Cargo.toml: syntax grammars are unusably slow unoptimized.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3
